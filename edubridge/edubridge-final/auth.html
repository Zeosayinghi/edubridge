<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橋學 EduBridge — 登入 / 註冊</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1a2e; --ink-soft: #3d3d5c;
  --mountain: #2d6a4f; --mountain-light: #52b788; --mountain-pale: #d8f3dc;
  --gold: #e9a84c; --gold-pale: #fdf3e3;
  --cream: #faf8f4; --border: rgba(45,106,79,0.15);
  --shadow: 0 4px 32px rgba(26,26,46,0.08);
  --error: #c0392b; --error-pale: #fdecea;
  --success: #2d6a4f; --success-pale: #d8f3dc;
}
html, body { height: 100%; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--cream); color: var(--ink);
  display: flex; flex-direction: column;
  min-height: 100vh;
}

/* NAV */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.2rem 3rem;
  background: rgba(250,248,244,0.95);
  border-bottom: 1px solid var(--border);
}
.logo { font-family: 'DM Serif Display','Noto Serif TC',serif; font-size: 1.3rem; color: var(--mountain); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
.logo-zh { font-family: 'Noto Serif TC',serif; font-size: 0.95rem; color: var(--ink-soft); font-weight: 400; }

/* MAIN */
main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 3rem 1.5rem;
  background: linear-gradient(135deg, var(--cream) 0%, var(--mountain-pale) 100%);
}
.auth-card {
  background: white; border-radius: 24px;
  padding: 2.5rem; width: 100%; max-width: 420px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.auth-header { text-align: center; margin-bottom: 2rem; }
.auth-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
.auth-header h1 { font-family: 'Noto Serif TC',serif; font-size: 1.6rem; font-weight: 700; color: var(--ink); margin-bottom: 0.4rem; }
.auth-header p { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.6; }

/* TABS */
.tabs { display: flex; background: var(--cream); border-radius: 12px; padding: 4px; margin-bottom: 2rem; }
.tab {
  flex: 1; text-align: center; padding: 0.6rem;
  font-size: 0.88rem; font-weight: 500; cursor: pointer;
  border-radius: 9px; border: none; background: transparent;
  color: var(--ink-soft); transition: all 0.2s;
}
.tab.active { background: white; color: var(--mountain); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

/* FORM */
.form-group { margin-bottom: 1.2rem; }
label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--ink-soft); margin-bottom: 0.4rem; letter-spacing: 0.02em; }
input {
  width: 100%; padding: 0.75rem 1rem;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 0.9rem; font-family: 'Noto Sans TC',sans-serif;
  color: var(--ink); background: white;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
input:focus { border-color: var(--mountain-light); box-shadow: 0 0 0 3px rgba(82,183,136,0.15); }
input::placeholder { color: #bbb; }

.btn-submit {
  width: 100%; padding: 0.9rem;
  background: var(--mountain); color: white;
  border: none; border-radius: 12px;
  font-size: 0.95rem; font-weight: 500;
  font-family: 'Noto Sans TC',sans-serif;
  cursor: pointer; transition: all 0.2s;
  margin-top: 0.5rem;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.btn-submit:hover { background: var(--mountain-light); transform: translateY(-1px); }
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* MESSAGES */
.msg {
  padding: 0.85rem 1rem; border-radius: 10px;
  font-size: 0.85rem; line-height: 1.6; margin-bottom: 1.2rem;
  display: none;
}
.msg.error { background: var(--error-pale); color: var(--error); border: 1px solid rgba(192,57,43,0.2); display: block; }
.msg.success { background: var(--success-pale); color: var(--success); border: 1px solid rgba(45,106,79,0.2); display: block; }

/* DIVIDER */
.divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider span { font-size: 0.78rem; color: var(--ink-soft); }

/* DASHBOARD (shown after login) */
#dashboard { display: none; }
.dash-header { text-align: center; margin-bottom: 2rem; }
.dash-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--mountain-pale); color: var(--mountain);
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Serif Display',serif; font-size: 1.6rem;
  margin: 0 auto 1rem;
}
.dash-header h2 { font-family: 'Noto Serif TC',serif; font-size: 1.3rem; color: var(--ink); margin-bottom: 0.3rem; }
.dash-header p { font-size: 0.82rem; color: var(--ink-soft); }
.dash-email-badge {
  display: inline-block; background: var(--mountain-pale); color: var(--mountain);
  font-size: 0.75rem; padding: 0.3rem 0.8rem; border-radius: 100px;
  margin-top: 0.5rem; font-weight: 500;
}
.dash-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1.5rem; }
.dash-card { background: var(--cream); border-radius: 12px; padding: 1rem; border: 1px solid var(--border); text-align: center; }
.dash-card-num { font-family: 'DM Serif Display',serif; font-size: 1.8rem; color: var(--mountain); }
.dash-card-lbl { font-size: 0.75rem; color: var(--ink-soft); margin-top: 0.2rem; }
.btn-goto {
  display: block; width: 100%; padding: 0.9rem;
  background: var(--mountain); color: white; text-decoration: none;
  border-radius: 12px; text-align: center;
  font-size: 0.9rem; font-weight: 500; margin-bottom: 0.8rem;
  transition: background 0.2s;
}
.btn-goto:hover { background: var(--mountain-light); }
.btn-logout {
  width: 100%; padding: 0.75rem;
  background: transparent; color: var(--ink-soft);
  border: 1.5px solid var(--border); border-radius: 12px;
  font-size: 0.85rem; font-family: 'Noto Sans TC',sans-serif;
  cursor: pointer; transition: all 0.2s;
}
.btn-logout:hover { border-color: var(--error); color: var(--error); }

/* LOADING SPINNER */
.spinner {
  width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer-note {
  display: block; text-align: center;
  font-size: 0.78rem; color: var(--ink-soft);
  margin-top: 1.5rem; line-height: 1.6;
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">⛰ EduBridge <span class="logo-zh">橋學</span></a>
</nav>

<main>
  <div class="auth-card">

    <!-- AUTH FORM -->
    <div id="auth-section">
      <div class="auth-header">
        <div class="auth-icon">⛰</div>
        <h1>歡迎來到橋學</h1>
        <p>登入或建立帳號，開始你的學習旅程</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">登入</button>
        <button class="tab" onclick="switchTab('signup')">註冊</button>
      </div>

      <div id="msg" class="msg"></div>

      <!-- LOGIN FORM -->
      <div id="login-form">
        <div class="form-group">
          <label>電子郵件</label>
          <input type="email" id="login-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input type="password" id="login-password" placeholder="輸入密碼" />
        </div>
        <button class="btn-submit" onclick="handleLogin()">
          <span id="login-btn-text">登入</span>
        </button>
        <div class="divider"><span>沒有帳號？</span></div>
        <div style="text-align:center">
          <button onclick="switchTab('signup')" style="background:none;border:none;color:var(--mountain);font-size:0.88rem;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:500;">建立新帳號 →</button>
        </div>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signup-form" style="display:none">
        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="signup-name" placeholder="你的名字" />
        </div>
        <div class="form-group">
          <label>電子郵件</label>
          <input type="email" id="signup-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>密碼 <span style="color:#aaa;font-weight:400">（至少 6 個字元）</span></label>
          <input type="password" id="signup-password" placeholder="設定密碼" />
        </div>
        <button class="btn-submit" onclick="handleSignup()">
          <span id="signup-btn-text">建立帳號</span>
        </button>
        <div class="divider"><span>已有帳號？</span></div>
        <div style="text-align:center">
          <button onclick="switchTab('login')" style="background:none;border:none;color:var(--mountain);font-size:0.88rem;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:500;">直接登入 →</button>
        </div>
      </div>
    </div>

    <!-- DASHBOARD (after login) -->
    <div id="dashboard">
      <div class="dash-header">
        <div class="dash-avatar" id="dash-avatar">?</div>
        <h2 id="dash-name">同學你好！</h2>
        <p>繼續你的學習旅程</p>
        <span class="dash-email-badge" id="dash-email"></span>
      </div>
      <div class="dash-cards">
        <div class="dash-card">
          <div class="dash-card-num">0</div>
          <div class="dash-card-lbl">已完成單元</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-num">0</div>
          <div class="dash-card-lbl">錯題待複習</div>
        </div>
      </div>
      <a href="index.html" class="btn-goto">前往課程列表 →</a>
      <button class="btn-logout" onclick="handleLogout()">登出</button>
    </div>

  </div>
</main>

<script>
const SUPABASE_URL = 'https://twbxgwtptkhuixordmcl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3Ynhnd3RwdGtodWl4b3JkbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODM3MjEsImV4cCI6MjA5NTk1OTcyMX0.8XwEDXL2w37KwjAHyo4TdoEHYrYAQtGPs9wsSW5dlT8';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}
function clearMsg() {
  const el = document.getElementById('msg');
  el.className = 'msg';
  el.textContent = '';
}

function switchTab(tab) {
  clearMsg();
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
  });
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none';
}

function setLoading(btnTextId, loading) {
  const el = document.getElementById(btnTextId);
  if (loading) {
    el.innerHTML = '<div class="spinner"></div>';
    el.parentElement.disabled = true;
  } else {
    el.innerHTML = btnTextId === 'login-btn-text' ? '登入' : '建立帳號';
    el.parentElement.disabled = false;
  }
}

async function handleLogin() {
  clearMsg();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showMsg('請填寫電子郵件和密碼', 'error'); return; }
  setLoading('login-btn-text', true);
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  setLoading('login-btn-text', false);
  if (error) { showMsg(translateError(error.message), 'error'); return; }
  showDashboard(data.user);
}

async function handleSignup() {
  clearMsg();
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  if (!name || !email || !password) { showMsg('請填寫所有欄位', 'error'); return; }
  if (password.length < 6) { showMsg('密碼至少需要 6 個字元', 'error'); return; }
  setLoading('signup-btn-text', true);
  const { data, error } = await db.auth.signUp({
    email, password,
    options: { data: { full_name: name } }
  });
  setLoading('signup-btn-text', false);
  if (error) { showMsg(translateError(error.message), 'error'); return; }
  if (data.user && data.user.identities && data.user.identities.length === 0) {
    showMsg('此 Email 已被使用，請直接登入', 'error'); return;
  }
  showMsg('✅ 註冊成功！請確認你的電子郵件以啟用帳號，再回來登入。', 'success');
}

async function handleLogout() {
  await db.auth.signOut();
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('auth-section').style.display = 'block';
  switchTab('login');
}

function showDashboard(user) {
  document.getElementById('auth-section').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  const name = user.user_metadata?.full_name || user.email.split('@')[0];
  const initial = name.charAt(0).toUpperCase();
  document.getElementById('dash-avatar').textContent = initial;
  document.getElementById('dash-name').textContent = name + ' 同學，你好！';
  document.getElementById('dash-email').textContent = user.email;
}

function translateError(msg) {
  if (msg.includes('Invalid login credentials')) return '電子郵件或密碼錯誤，請重試';
  if (msg.includes('Email not confirmed')) return '請先確認你的電子郵件再登入';
  if (msg.includes('User already registered')) return '此 Email 已被使用，請直接登入';
  if (msg.includes('Password should be at least')) return '密碼至少需要 6 個字元';
  if (msg.includes('Unable to validate email')) return '電子郵件格式不正確';
  return '發生錯誤，請稍後再試';
}

// Check if already logged in
db.auth.getSession().then(({ data: { session } }) => {
  if (session) showDashboard(session.user);
});

// Enter key support
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('login-form').style.display !== 'none';
  if (loginVisible) handleLogin();
  else handleSignup();
});
</script>
</body>
</html>
